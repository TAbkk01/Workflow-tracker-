<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Collaborative Workflow Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    // Firebase configuration fallback
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-api-key",
          authDomain: "demo-project.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo-project.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:demo"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-workflow-app';

    window.FirebaseServices = {
      auth,
      db,
      storage,
      appId,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      collection,
      doc,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      ref,
      uploadBytes,
      getDownloadURL
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- CONSTANTS & CONFIGURATION ---
    const STAGES = [
      { id: 'backlog', name: 'Backlog', badge: 'bg-slate-100 text-slate-700 border-slate-200' },
      { id: 'in_progress', name: 'In Progress', badge: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'in_review', name: 'In Review', badge: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'completed', name: 'Approved & Done', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
    ];

    const PRIORITIES = {
      low: { label: 'Low', color: 'bg-slate-100 text-slate-600 border-slate-200', order: 1 },
      medium: { label: 'Medium', color: 'bg-blue-100 text-blue-700 border-blue-200', order: 2 },
      high: { label: 'High', color: 'bg-amber-100 text-amber-700 border-amber-200', order: 3 },
      urgent: { label: 'Urgent', color: 'bg-rose-100 text-rose-700 border-rose-200', order: 4 }
    };

    const FREQUENCIES = {
      daily: { label: 'Daily', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      weekly: { label: 'Weekly', badge: 'bg-purple-50 text-purple-700 border-purple-200' },
      monthly: { label: 'Monthly', badge: 'bg-teal-50 text-teal-700 border-teal-200' }
    };

    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        layers: <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z M22 12.5l-8.58 3.91a2 2 0 0 1-1.66 0L3.18 12.5 M22 17.5l-8.58 3.91a2 2 0 0 1-1.66 0L3.18 17.5" />,
        plus: <path d="M5 12h14 M12 5v14" />,
        search: <path d="m21 21-4.3-4.3 M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />,
        filter: <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />,
        checkCircle: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4 12 14.01l-3-3" />,
        clock: <path d="M12 6v6l4 2 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" />,
        alertCircle: <path d="M12 8v4 M12 16h.01 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" />,
        uploadCloud: <path d="M4 14.89c0 4 3.13 7.11 7 7.11h7a5 5 0 0 0 1.5-9.8 7 7 0 0 0-13.2-2.2 4 4 0 0 0-2.3 4.89z M12 12v9 M16 16l-4-4-4 4" />,
        fileText: <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z M14 2v4a2 2 0 0 0 2 2h4 M10 9H8 M16 13H8 M16 17H8" />,
        externalLink: <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14 21 3" />,
        trash: <path d="M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />,
        edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />,
        user: <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />,
        calendar: <path d="M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />,
        repeat: <path d="m17 2 4 4-4 4 M3 11v-1a4 4 0 0 1 4-4h14 M7 22l-4-4 4-4 M21 13v1a4 4 0 0 1-4 4H3" />,
        x: <path d="M18 6 6 18 M6 6l12 12" />,
        copy: <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2 M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z" />,
        shieldCheck: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M9 12l2 2 4-4" />
      };

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);

      const [activeTab, setActiveTab] = useState('main'); // 'main' | 'recurring' | 'activity'
      const [viewMode, setViewMode] = useState('kanban'); // 'kanban' | 'list'
      const [recurringFrequency, setRecurringFrequency] = useState('all');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStatus, setSelectedStatus] = useState('all');
      const [selectedPriority, setSelectedPriority] = useState('all');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [submittingTask, setSubmittingTask] = useState(null);
      const [reviewingTask, setReviewingTask] = useState(null);
      const [taskToDelete, setTaskToDelete] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseServices;
        
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Auth initialization error:", e);
          }
        };

        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
        });

        return () => unsubscribe();
      }, []);

      // Real-time Firestore Sync (Strict Rule 1: /artifacts/{appId}/public/data/tasks)
      useEffect(() => {
        if (!user) return;

        const { db, appId, collection, onSnapshot } = window.FirebaseServices;
        const tasksCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');

        setLoading(true);
        const unsubscribe = onSnapshot(tasksCollectionRef, (snapshot) => {
          const loadedTasks = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          setTasks(loadedTasks);
          setLoading(false);
        }, (error) => {
          console.error("Real-time listener error:", error);
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user]);

      const handleSaveTask = async (taskData) => {
        if (!user) return;
        const { db, appId, collection, doc, setDoc, addDoc } = window.FirebaseServices;

        try {
          if (editingTask) {
            const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', editingTask.id);
            await setDoc(taskDocRef, { ...editingTask, ...taskData }, { merge: true });
            showToast('Task updated successfully!', 'success');
          } else {
            const tasksCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
            await addDoc(tasksCollectionRef, {
              ...taskData,
              evidenceFiles: [],
              createdAt: new Date().toISOString().split('T')[0]
            });
            showToast('New task added!', 'success');
          }
        } catch (e) {
          console.error("Error saving task:", e);
          showToast('Failed to save task', 'error');
        }

        setIsModalOpen(false);
        setEditingTask(null);
      };

      const confirmDeleteTask = async () => {
        if (!user || !taskToDelete) return;
        const { db, appId, doc, deleteDoc } = window.FirebaseServices;

        try {
          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskToDelete.id);
          await deleteDoc(taskDocRef);
          showToast('Task removed', 'info');
        } catch (e) {
          console.error("Error deleting task:", e);
        }

        setTaskToDelete(null);
      };

      const handleMoveStage = async (taskId, newStatus) => {
        if (!user) return;
        const { db, appId, doc, updateDoc } = window.FirebaseServices;

        try {
          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId);
          await updateDoc(taskDocRef, { status: newStatus });
          const stageName = STAGES.find(s => s.id === newStatus)?.name;
          showToast(`Moved task to ${stageName}`, 'info');
        } catch (e) {
          console.error("Error moving stage:", e);
        }
      };

      const handleSubmitEvidence = async (taskId, submissionData) => {
        if (!user) return;
        const { db, storage, appId, doc, updateDoc, ref, uploadBytes, getDownloadURL } = window.FirebaseServices;

        try {
          const uploadedFileUrls = [];

          if (submissionData.newFiles && submissionData.newFiles.length > 0) {
            for (const fileObj of submissionData.newFiles) {
              if (fileObj.rawFile) {
                try {
                  const storageRef = ref(storage, `evidence/${appId}/${Date.now()}_${fileObj.rawFile.name}`);
                  await uploadBytes(storageRef, fileObj.rawFile);
                  const downloadUrl = await getDownloadURL(storageRef);
                  uploadedFileUrls.push({
                    id: `file-${Date.now()}`,
                    name: fileObj.rawFile.name,
                    type: fileObj.rawFile.type,
                    dataUrl: downloadUrl
                  });
                } catch (err) {
                  console.warn("Storage upload fallback to base64 preview:", err);
                  uploadedFileUrls.push({
                    id: `file-${Date.now()}`,
                    name: fileObj.rawFile.name,
                    type: fileObj.rawFile.type,
                    dataUrl: fileObj.previewUrl || ''
                  });
                }
              }
            }
          }

          const targetTask = tasks.find(t => t.id === taskId);
          const existingFiles = targetTask?.evidenceFiles || [];

          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId);
          await updateDoc(taskDocRef, {
            status: submissionData.markCompletedImmediately ? 'completed' : 'in_review',
            evidenceUrl: submissionData.evidenceUrl || targetTask?.evidenceUrl || '',
            evidenceFiles: [...existingFiles, ...uploadedFileUrls],
            submitterNotes: submissionData.submitterNotes || '',
            submittedAt: new Date().toLocaleString(),
            submittedBy: submissionData.submittedBy || 'Team Member'
          });

          showToast('Proof submitted for review!', 'success');
        } catch (e) {
          console.error("Error submitting evidence:", e);
          showToast('Error submitting proof', 'error');
        }

        setSubmittingTask(null);
      };

      const handleApproveReject = async (taskId, newStatus, feedback = '') => {
        if (!user) return;
        const { db, appId, doc, updateDoc } = window.FirebaseServices;

        try {
          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId);
          await updateDoc(taskDocRef, { 
            status: newStatus,
            reviewFeedback: feedback
          });
          
          if (newStatus === 'completed') {
            showToast('Work approved & marked complete!', 'success');
          } else {
            showToast('Revisions requested.', 'info');
          }
        } catch (e) {
          console.error("Error updating status:", e);
        }

        setReviewingTask(null);
      };

      const copyBoardCode = () => {
        try {
          const textToCopy = boardId;
          const textarea = document.createElement('textarea');
          textarea.value = textToCopy;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast(`Board code '${boardId}' copied!`, 'success');
        } catch (e) {
          showToast(`Board Code: ${boardId}`, 'info');
        }
      };

      // Filtered Tasks Memo
      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          if (activeTab === 'recurring' && !task.isRecurring) return false;
          if (activeTab === 'recurring' && recurringFrequency !== 'all' && task.frequency !== recurringFrequency) {
            return false;
          }

          const matchesSearch = 
            (task.title || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.description || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.assignee || '').toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesStatus = selectedStatus === 'all' || task.status === selectedStatus;
          const matchesPriority = selectedPriority === 'all' || task.priority === selectedPriority;

          return matchesSearch && matchesStatus && matchesPriority;
        });
      }, [tasks, activeTab, recurringFrequency, searchQuery, selectedStatus, selectedPriority]);

      // Metrics Summary
      const metrics = useMemo(() => {
        return {
          total: tasks.length,
          inProgress: tasks.filter(t => t.status === 'in_progress').length,
          inReview: tasks.filter(t => t.status === 'in_review').length,
          completed: tasks.filter(t => t.status === 'completed').length
        };
      }, [tasks]);

      return (
        <div className="min-h-screen flex flex-col font-sans pb-12">
          
          {/* Top Header Navbar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                  <Icon name="layers" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight flex items-center space-x-2">
                    <span>Collaborative Workflow Tracker</span>
                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase border border-emerald-200 flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      Live Sync
                    </span>
                  </h1>
                  <p className="text-xs text-slate-500 font-medium hidden sm:block">Shared Real-Time Task & Deliverable Tracker</p>
                </div>
              </div>

              {/* Actions Header */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => {
                    setEditingTask(null);
                    setIsModalOpen(true);
                  }}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-sm cursor-pointer transition-all active:scale-95"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>New Shared Task</span>
                </button>
              </div>
            </div>
          </header>

          {}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col space-y-6">
            
            {/* Quick Metrics Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-slate-100 text-slate-700">
                  <Icon name="layers" className="w-5 h-5" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-500">Total Tasks</div>
                  <div className="text-lg font-extrabold text-slate-900">{metrics.total}</div>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-blue-50 text-blue-600">
                  <Icon name="clock" className="w-5 h-5" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-500">In Progress</div>
                  <div className="text-lg font-extrabold text-blue-600">{metrics.inProgress}</div>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-amber-50 text-amber-600">
                  <Icon name="alertCircle" className="w-5 h-5" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-500">Needs Review</div>
                  <div className="text-lg font-extrabold text-amber-600">{metrics.inReview}</div>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-emerald-50 text-emerald-600">
                  <Icon name="checkCircle" className="w-5 h-5" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-500">Approved</div>
                  <div className="text-lg font-extrabold text-emerald-600">{metrics.completed}</div>
                </div>
              </div>
            </div>

            {}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-3">
              
              {/* Active Tab Switcher */}
              <div className="flex space-x-4">
                <button
                  onClick={() => setActiveTab('main')}
                  className={`text-xs sm:text-sm font-bold pb-2 border-b-2 transition-all cursor-pointer flex items-center space-x-1.5 ${
                    activeTab === 'main' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'
                  }`}
                >
                  <Icon name="layers" className="w-4 h-4" />
                  <span>All Tasks ({tasks.length})</span>
                </button>

                <button
                  onClick={() => setActiveTab('recurring')}
                  className={`text-xs sm:text-sm font-bold pb-2 border-b-2 transition-all cursor-pointer flex items-center space-x-1.5 ${
                    activeTab === 'recurring' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'
                  }`}
                >
                  <Icon name="repeat" className="w-4 h-4" />
                  <span>Recurring Tasks ({tasks.filter(t => t.isRecurring).length})</span>
                </button>
              </div>

              {/* View Mode Toggle */}
              {activeTab === 'main' && (
                <div className="flex items-center space-x-1 bg-slate-200/70 p-1 rounded-xl self-start sm:self-auto">
                  <button
                    onClick={() => setViewMode('kanban')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      viewMode === 'kanban' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Board
                  </button>
                  <button
                    onClick={() => setViewMode('list')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      viewMode === 'list' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Table List
                  </button>
                </div>
              )}
            </div>

            {/* Filter Bar */}
            <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs flex flex-wrap items-center justify-between gap-3">
              <div className="relative flex-1 min-w-[220px]">
                <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                <input
                  type="text"
                  placeholder="Search tasks, assignee, descriptions..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="text-xs pl-9 pr-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 w-full"
                />
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {activeTab === 'recurring' ? (
                  <select
                    value={recurringFrequency}
                    onChange={(e) => setRecurringFrequency(e.target.value)}
                    className="text-xs border border-slate-200 bg-white rounded-xl px-3 py-2 text-slate-700 font-semibold focus:outline-none"
                  >
                    <option value="all">All Frequencies</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                  </select>
                ) : (
                  <select
                    value={selectedStatus}
                    onChange={(e) => setSelectedStatus(e.target.value)}
                    className="text-xs border border-slate-200 bg-white rounded-xl px-3 py-2 text-slate-700 font-semibold focus:outline-none"
                  >
                    <option value="all">All Stages</option>
                    {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                )}

                <select
                  value={selectedPriority}
                  onChange={(e) => setSelectedPriority(e.target.value)}
                  className="text-xs border border-slate-200 bg-white rounded-xl px-3 py-2 text-slate-700 font-semibold focus:outline-none"
                >
                  <option value="all">All Priorities</option>
                  {Object.keys(PRIORITIES).map(p => <option key={p} value={p}>{PRIORITIES[p].label}</option>)}
                </select>

                {(searchQuery || selectedStatus !== 'all' || selectedPriority !== 'all' || recurringFrequency !== 'all') && (
                  <button
                    onClick={() => {
                      setSearchQuery('');
                      setSelectedStatus('all');
                      setSelectedPriority('all');
                      setRecurringFrequency('all');
                    }}
                    className="text-xs font-semibold text-rose-600 hover:text-rose-800 px-2 py-1 cursor-pointer"
                  >
                    Clear Filters
                  </button>

            {/* Main Board Container */}
            {loading ? (
              <div className="text-center py-20 text-slate-500 font-medium animate-pulse">

              </div>
            ) : filteredTasks.length === 0 ? (
              <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-2xs">
                <Icon name="layers" className="w-10 h-10 text-slate-300 mx-auto mb-3" />
                <p className="text-slate-700 font-bold text-sm">No tasks found matching current filters.</p>
                <p className="text-slate-400 text-xs mt-1">Create a task or clear filter criteria to see existing items.</p>
              </div>
            ) : viewMode === 'kanban' || activeTab === 'recurring' ? (
              <KanbanView
                tasks={filteredTasks}
                stages={STAGES}
                onMoveStage={handleMoveStage}
                onOpenSubmitModal={setSubmittingTask}
                onOpenReviewModal={setReviewingTask}
                onEditTask={(task) => { setEditingTask(task); setIsModalOpen(true); }}
                onDeleteTask={setTaskToDelete}
              />
            ) : (
              <TableView
                tasks={filteredTasks}
                stages={STAGES}
                onMoveStage={handleMoveStage}
                onOpenSubmitModal={setSubmittingTask}
                onOpenReviewModal={setReviewingTask}
                onEditTask={(task) => { setEditingTask(task); setIsModalOpen(true); }}
                onDeleteTask={setTaskToDelete}
              />
            )}
          </main>

          {}
          {isModalOpen && (
            <TaskModal
              task={editingTask}
              stages={STAGES}
              onClose={() => { setIsModalOpen(false); setEditingTask(null); }}
              onSave={handleSaveTask}
            />
          )}

          {}
          {submittingTask && (
            <SubmitProofModal
              task={submittingTask}
              onClose={() => setSubmittingTask(null)}
              onSubmit={(data) => handleSubmitEvidence(submittingTask.id, data)}
            />
          )}

          {}
          {reviewingTask && (
            <ReviewProofModal
              task={reviewingTask}
              onClose={() => setReviewingTask(null)}
              onApprove={() => handleApproveReject(reviewingTask.id, 'completed')}
              onReject={(feedback) => handleApproveReject(reviewingTask.id, 'in_progress', feedback)}
            />
          )}

          {}
          {taskToDelete && (
            <DeleteModal
              taskTitle={taskToDelete.title}
              onConfirm={confirmDeleteTask}
              onCancel={() => setTaskToDelete(null)}
            />
          )}

          {}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold text-white transition-all transform animate-fade-in ${
              toast.type === 'success' ? 'bg-emerald-600' : toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-800'
            }`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    function SubmitProofModal({ task, onClose, onSubmit }) {
      const [submitterName, setSubmitterName] = useState(task.assignee || '');
      const [evidenceUrl, setEvidenceUrl] = useState(task.evidenceUrl || '');
      const [submitterNotes, setSubmitterNotes] = useState(task.submitterNotes || '');
      const [files, setFiles] = useState([]);

      const handleFileChange = (e) => {
        const selected = Array.from(e.target.files);
        const processed = selected.map(file => {
          const isImg = file.type.startsWith('image/');
          return {
            rawFile: file,
            name: file.name,
            previewUrl: isImg ? URL.createObjectURL(file) : ''
          };
        });
        setFiles(prev => [...prev, ...processed]);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4 text-xs animate-fade-in">
            
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="font-bold text-base text-slate-900">Submit Deliverable Proof</h3>
                <p className="text-slate-500 text-[11px] font-medium mt-0.5">Task: {task.title}</p>

              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">
                <Icon name="x" className="w-5 h-5" />

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Your Name *</label>
              <input
                type="text"
                required
                placeholder="Your Name"
                value={submitterName}
                onChange={(e) => setSubmitterName(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Link to Deliverable / Published Post / Document</label>
              <input
                type="url"
                placeholder="https://..."
                value={evidenceUrl}
                onChange={(e) => setEvidenceUrl(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Attach Media or Document Files</label>
              <input
                type="file"
                multiple
                accept="image/*,video/*,.pdf"
                onChange={handleFileChange}
                className="w-full text-xs text-slate-500 border border-slate-200 rounded-xl p-2 bg-slate-50"
              />

              <div className="flex flex-wrap gap-2 pt-1">

                  <span key={idx} className="bg-slate-100 text-slate-700 text-[10px] px-2 py-1 rounded-md border border-slate-200">
                    {f.name}

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Submission Notes / Deliverable Summary</label>
              <textarea
                rows={2}
                placeholder="Notes for reviewer or approver..."
                value={submitterNotes}
                onChange={(e) => setSubmitterNotes(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
              <button 
                onClick={onClose} 
                className="px-4 py-2 border border-slate-200 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"

                onClick={() => onSubmit({ submittedBy: submitterName, evidenceUrl, submitterNotes, newFiles: files })}

              >
                <Icon name="uploadCloud" className="w-4 h-4" />
                <span>Upload & Send for Review</span>
              </button>
            </div>

          </div>
        </div>
      );

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-xl w-full p-6 space-y-4 text-xs animate-fade-in">
            
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="font-bold text-base text-slate-900">Inspect Work Deliverable</h3>

                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Submitter Box */}
            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between">
              <div>
                <div className="font-bold text-slate-800">Submitted by: {task.submittedBy || 'Team Member'}</div>
                <div className="text-slate-500 text-[10px] mt-0.5">Date: {task.submittedAt || 'Recently'}</div>
              </div>
              <span className="text-[10px] font-extrabold px-2 py-1 rounded bg-amber-100 text-amber-800 border border-amber-200 uppercase">
                {task.status === 'completed' ? 'Approved' : 'In Review'}
              </span>
            </div>

            {task.submitterNotes && (
              <div>
                <span className="font-bold text-slate-700 block mb-1">Submitter Notes:</span>
                <p className="p-2.5 bg-slate-100/70 rounded-xl text-slate-800 font-medium">{task.submitterNotes}</p>
              </div>
            )}

            {task.evidenceUrl && (
              <div>
                <span className="font-bold text-slate-700 block mb-1">Deliverable Link:</span>
                <a 
                  href={task.evidenceUrl} 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  className="text-indigo-600 hover:text-indigo-800 font-bold underline flex items-center space-x-1 break-all"
                >
                  <span>{task.evidenceUrl}</span>
                  <Icon name="externalLink" className="w-3.5 h-3.5 shrink-0" />
                </a>
              </div>
            )}

            {/* Attached Media Files */}
            {task.evidenceFiles && task.evidenceFiles.length > 0 && (
              <div>
                <span className="font-bold text-slate-700 block mb-1.5">Attached Files ({task.evidenceFiles.length}):</span>
                <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-1">
                  {task.evidenceFiles.map((f, i) => (
                    <div key={i} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-900 relative group h-28 flex items-center justify-center">
                      {f.type?.startsWith('image/') || f.dataUrl?.startsWith('data:image') ? (
                        <img src={f.dataUrl} alt="Proof" className="w-full h-full object-cover" />
                      ) : (
                        <div className="text-center p-2 text-white text-[10px]">
                          <Icon name="fileText" className="w-6 h-6 mx-auto mb-1 text-slate-300" />
                          <div className="truncate">{f.name || 'Attached File'}</div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Feedback Input */}
            <div>
              <label className="font-semibold text-slate-700 block mb-1">Review Feedback / Revision Notes</label>
              <textarea
                rows={2}
                placeholder="Optional feedback for team member..."
                value={feedback}
                onChange={(e) => setFeedback(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div className="flex justify-between items-center pt-4 border-t border-slate-100">
              <button 
                onClick={() => onReject(feedback)} 
                className="px-4 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 font-bold rounded-xl transition-colors cursor-pointer"
              >
                Request Revisions
              </button>
              
              <button 
                onClick={onApprove} 
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all shadow-xs cursor-pointer flex items-center space-x-1.5"
              >
                <Icon name="checkCircle" className="w-4 h-4" />
                <span>Approve & Complete</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    function DeleteModal({ taskTitle, onConfirm, onCancel }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-md w-full text-center space-y-4 animate-fade-in">
            <div className="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto">
              <Icon name="trash" className="w-6 h-6" />
            </div>
            <div>
              <h3 className="font-bold text-base text-slate-900">Delete Task?</h3>
              <p className="text-xs text-slate-500 mt-1">Are you sure you want to delete "{taskTitle}"?</p>
            </div>
            <div className="flex justify-center space-x-2 pt-2">
              <button onClick={onCancel} className="px-4 py-2 border rounded-xl text-xs font-semibold hover:bg-slate-50 cursor-pointer">
                Cancel
              </button>
              <button onClick={onConfirm} className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-xs cursor-pointer">
                Delete
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
