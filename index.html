<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Workflow & Task Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons Vanilla JS -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App & Firestore -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper for rendering Lucide icons safely
    const Icon = ({ name, className = "w-4 h-4", size, color }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);

      return <i data-lucide={name} className={className} style={{ fontSize: size, color }}></i>;
    };

    // Public Firebase Config for Shared Realtime Sync
    const firebaseConfig = {
      apiKey: "AIzaSyD-shared-workflow-public-key-2026",
      authDomain: "shared-workflow-app.firebaseapp.com",
      projectId: "shared-workflow-app",
      storageBucket: "shared-workflow-app.appspot.com",
      messagingSenderId: "998877665544",
      appId: "1:998877665544:web:abc123sharedapp"
    };

    // Initialize Firebase safely
    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firestore running in fallback storage mode.", e);
    }

    const INITIAL_TASKS = [
      {
        id: "task-1",
        title: "Create Product Video Demo",
        description: "Film and edit a 60-second video demonstrating the key features for Instagram Reels and TikTok.",
        status: "in_progress",
        priority: "high",
        type: "project",
        assignee: "Alex Rivera",
        dueDate: "2026-10-05",
        createdAt: new Date().toISOString(),
        tags: ["Video", "Social Media"],
        evidenceUrl: "https://youtube.com",
        evidenceNotes: "Finished first draft. Edited in CapCut.",
        evidenceMedia: [],
        completedAt: null
      },
      {
        id: "task-2",
        title: "Weekly Inventory & Supply Check",
        description: "Verify physical stock levels against accounting records and update stock sheet.",
        status: "backlog",
        priority: "medium",
        type: "weekly",
        assignee: "Sam Chen",
        dueDate: "2026-10-02",
        createdAt: new Date().toISOString(),
        tags: ["Operations", "Audit"],
        evidenceUrl: "",
        evidenceNotes: "",
        evidenceMedia: [],
        completedAt: null
      },
      {
        id: "task-3",
        title: "Daily Social Media Story Post",
        description: "Post at least 2 behind-the-scenes stories on Instagram and respond to initial comments.",
        status: "completed",
        priority: "high",
        type: "daily",
        assignee: "Jordan Taylor",
        dueDate: new Date().toISOString().split('T')[0],
        createdAt: new Date().toISOString(),
        tags: ["Marketing", "Daily Routine"],
        evidenceUrl: "https://instagram.com",
        evidenceNotes: "Posted morning update and promotional story.",
        evidenceMedia: [],
        completedAt: new Date().toISOString()
      }
    ];

    function App() {
      // Local state
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("shared_workflow_tasks");
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [activeTab, setActiveTab] = useState("all"); // 'all', 'kanban', 'daily', 'weekly', 'monthly'
      const [searchQuery, setSearchQuery] = useState("");
      const [filterPriority, setFilterPriority] = useState("all");
      const [filterAssignee, setFilterAssignee] = useState("all");
      
      // Modals
      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [submittingEvidenceTask, setSubmittingEvidenceTask] = useState(null);
      const [viewingEvidenceTask, setViewingEvidenceTask] = useState(null);
      const [deletingTaskId, setDeletingTaskId] = useState(null);
      
      // Toast & Recovery
      const [toast, setToast] = useState(null);
      const [lastDeletedTask, setLastDeletedTask] = useState(null);

      // Form State for Create/Edit
      const [formData, setFormData] = useState({
        title: "",
        description: "",
        status: "backlog",
        priority: "medium",
        type: "project",
        assignee: "",
        dueDate: new Date().toISOString().split('T')[0],
        tags: "",
        evidenceUrl: ""
      });

      // Form State for Submitting Evidence
      const [evidenceForm, setEvidenceForm] = useState({
        submittedBy: "",
        evidenceUrl: "",
        evidenceNotes: "",
        mediaFiles: []
      });

      // Sync to localStorage
      useEffect(() => {
        localStorage.setItem("shared_workflow_tasks", JSON.stringify(tasks));
      }, [tasks]);

      // Firebase Realtime Listener
      useEffect(() => {
        if (!db) return;
        const unsubscribe = db.collection("global_workspace_tasks").onSnapshot((snapshot) => {
          if (!snapshot.empty) {
            const remoteTasks = [];
            snapshot.forEach(doc => remoteTasks.push({ id: doc.id, ...doc.data() }));
            setTasks(remoteTasks);
          }
        }, (err) => console.log("Realtime sync notice:", err.message));

        return () => unsubscribe();
      }, []);

      // Refresh icons on state change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Toast auto-clear
      useEffect(() => {
        if (toast) {
          const timer = setTimeout(() => setToast(null), 5000);
          return () => clearTimeout(timer);
        }
      }, [toast]);

      // Save/Update Task handler
      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        const taskPayload = {
          title: formData.title,
          description: formData.description,
          status: formData.status,
          priority: formData.priority,
          type: formData.type || "project",
          assignee: formData.assignee || "Unassigned",
          dueDate: formData.dueDate,
          tags: typeof formData.tags === 'string' ? formData.tags.split(',').map(t => t.trim()).filter(Boolean) : formData.tags,
          evidenceUrl: formData.evidenceUrl || "",
        };

        if (editingTask) {
          const updated = tasks.map(t => t.id === editingTask.id ? { ...t, ...taskPayload } : t);
          setTasks(updated);
          if (db) db.collection("global_workspace_tasks").doc(editingTask.id).set(taskPayload, { merge: true }).catch(() => {});
          showToast("Task updated successfully");
        } else {
          const newTask = {
            id: "task-" + Date.now(),
            ...taskPayload,
            createdAt: new Date().toISOString(),
            evidenceNotes: "",
            evidenceMedia: [],
            completedAt: null
          };
          const updated = [newTask, ...tasks];
          setTasks(updated);
          if (db) db.collection("global_workspace_tasks").doc(newTask.id).set(newTask).catch(() => {});
          showToast("New task created");
        }

        closeModal();
      };

      // Confirm Delete
      const confirmDeleteTask = (id) => {
        const taskToDelete = tasks.find(t => t.id === id);
        if (!taskToDelete) return;

        setLastDeletedTask(taskToDelete);
        const updated = tasks.filter(t => t.id !== id);
        setTasks(updated);

        if (db) db.collection("global_workspace_tasks").doc(id).delete().catch(() => {});

        setDeletingTaskId(null);
        showToast(`Deleted "${taskToDelete.title}"`, true);
      };

      // Undo Delete
      const undoDelete = () => {
        if (!lastDeletedTask) return;
        setTasks(prev => [lastDeletedTask, ...prev]);
        if (db) db.collection("global_workspace_tasks").doc(lastDeletedTask.id).set(lastDeletedTask).catch(() => {});
        setLastDeletedTask(null);
        showToast("Task restored");
      };

      // Quick Status Move
      const handleStatusChange = (taskId, newStatus) => {
        const updated = tasks.map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              status: newStatus,
              completedAt: newStatus === 'completed' ? new Date().toISOString() : t.completedAt
            };
          }
          return t;
        });
        setTasks(updated);
        if (db) db.collection("global_workspace_tasks").doc(taskId).update({ 
          status: newStatus,
          completedAt: newStatus === 'completed' ? new Date().toISOString() : null 
        }).catch(() => {});
        showToast(`Moved to ${newStatus.replace('_', ' ')}`);
      };

      // Submit Evidence Handler
      const handleEvidenceSubmit = (e) => {
        e.preventDefault();
        if (!submittingEvidenceTask) return;

        const updatedTasks = tasks.map(t => {
          if (t.id === submittingEvidenceTask.id) {
            return {
              ...t,
              status: "completed",
              assignee: evidenceForm.submittedBy || t.assignee,
              evidenceUrl: evidenceForm.evidenceUrl || t.evidenceUrl,
              evidenceNotes: evidenceForm.evidenceNotes || t.evidenceNotes,
              evidenceMedia: [...(t.evidenceMedia || []), ...evidenceForm.mediaFiles],
              completedAt: new Date().toISOString()
            };
          }
          return t;
        });

        setTasks(updatedTasks);
        
        if (db) {
          const target = updatedTasks.find(t => t.id === submittingEvidenceTask.id);
          db.collection("global_workspace_tasks").doc(submittingEvidenceTask.id).set(target, { merge: true }).catch(() => {});
        }

        showToast("Work proof submitted successfully!");
        setSubmittingEvidenceTask(null);
        setEvidenceForm({ submittedBy: "", evidenceUrl: "", evidenceNotes: "", mediaFiles: [] });
      };

      // File Attachment Handler
      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (uploadEvent) => {
            const mediaObj = {
              id: "media-" + Date.now() + Math.random(),
              name: file.name,
              type: file.type.startsWith("video") ? "video" : "image",
              dataUrl: uploadEvent.target.result,
              uploadedAt: new Date().toISOString()
            };
            setEvidenceForm(prev => ({
              ...prev,
              mediaFiles: [...prev.mediaFiles, mediaObj]
            }));
          };
          reader.readAsDataURL(file);
        });
      };

      const showToast = (message, hasUndo = false) => {
        setToast({ message, hasUndo });
      };

      const openCreateModal = () => {
        setEditingTask(null);
        setFormData({
          title: "",
          description: "",
          status: "backlog",
          priority: "medium",
          type: activeTab === 'all' || activeTab === 'kanban' ? 'project' : activeTab,
          assignee: "",
          dueDate: new Date().toISOString().split('T')[0],
          tags: "",
          evidenceUrl: ""
        });
        setIsCreateModalOpen(true);
      };

      const openEditModal = (task) => {
        setEditingTask(task);
        setFormData({
          title: task.title,
          description: task.description || "",
          status: task.status,
          priority: task.priority,
          type: task.type || "project",
          assignee: task.assignee || "",
          dueDate: task.dueDate || "",
          tags: Array.isArray(task.tags) ? task.tags.join(", ") : "",
          evidenceUrl: task.evidenceUrl || ""
        });
        setIsCreateModalOpen(true);
      };

      const closeModal = () => {
        setIsCreateModalOpen(false);
        setEditingTask(null);
      };

      // Filtering logic
      const filteredTasks = tasks.filter(task => {
        const matchesSearch = task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (task.description && task.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                              (task.assignee && task.assignee.toLowerCase().includes(searchQuery.toLowerCase()));
        
        const matchesPriority = filterPriority === 'all' || task.priority === filterPriority;
        const matchesAssignee = filterAssignee === 'all' || task.assignee === filterAssignee;
        
        let matchesTab = true;
        if (activeTab === 'daily') matchesTab = task.type === 'daily';
        if (activeTab === 'weekly') matchesTab = task.type === 'weekly';
        if (activeTab === 'monthly') matchesTab = task.type === 'monthly';

        return matchesSearch && matchesPriority && matchesAssignee && matchesTab;
      });

      // Get unique assignees
      const uniqueAssignees = Array.from(new Set(tasks.map(t => t.assignee).filter(Boolean)));

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          <!-- Top Navigation -->
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                <!-- Logo & Title -->
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <Icon name="check-square" className="w-6 h-6" />
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-slate-900 leading-tight">Shared Team Tracker</h1>
                    <p className="text-xs text-slate-500 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                      Live Collaboration Mode
                    </p>
                  </div>
                </div>

                <!-- Primary Create Action -->
                <button
                  onClick={openCreateModal}
                  className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg shadow-sm hover:bg-indigo-700 transition active:scale-95"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  New Task
                </button>
              </div>
            </div>
          </header>

          <!-- Main Workspace -->
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

            <!-- Tab Navigation & Quick Filters -->
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
              
              <!-- Tab Group -->
              <div className="flex bg-slate-200/80 p-1 rounded-xl w-full md:w-auto overflow-x-auto custom-scrollbar">
                <button
                  onClick={() => setActiveTab('all')}
                  className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'all' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="layout-grid" className="w-4 h-4" />
                  All Tasks
                </button>
                <button
                  onClick={() => setActiveTab('kanban')}
                  className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'kanban' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="kanban" className="w-4 h-4" />
                  Kanban Board
                </button>
                <button
                  onClick={() => setActiveTab('daily')}
                  className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'daily' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="calendar-days" className="w-4 h-4" />
                  Daily Routines
                </button>
                <button
                  onClick={() => setActiveTab('weekly')}
                  className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'weekly' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="calendar-range" className="w-4 h-4" />
                  Weekly Tasks
                </button>
                <button
                  onClick={() => setActiveTab('monthly')}
                  className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'monthly' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  <Icon name="calendar" className="w-4 h-4" />
                  Monthly Goals
                </button>
              </div>

              <!-- Search Bar & Filters -->
              <div className="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                
                <!-- Search Input -->
                <div className="relative flex-1 sm:w-64">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <Icon name="search" className="w-4 h-4" />
                  </span>
                  <input
                    type="text"
                    placeholder="Search tasks or names..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                  />
                </div>

                <!-- Priority Filter -->
                <select
                  value={filterPriority}
                  onChange={(e) => setFilterPriority(e.target.value)}
                  className="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                >
                  <option value="all">All Priorities</option>
                  <option value="high">High Priority</option>
                  <option value="medium">Medium Priority</option>
                  <option value="low">Low Priority</option>
                </select>

                <!-- Assignee Filter -->
                <select
                  value={filterAssignee}
                  onChange={(e) => setFilterAssignee(e.target.value)}
                  className="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                >
                  <option value="all">All Names</option>
                  {uniqueAssignees.map(name => (
                    <option key={name} value={name}>{name}</option>
                  ))}
                </select>
              </div>
            </div>

            <!-- VIEW RENDERER -->
            {activeTab === 'kanban' ? (
              <KanbanView 
                tasks={filteredTasks} 
                onEdit={openEditModal} 
                onDelete={(id) => setDeletingTaskId(id)} 
                onStatusChange={handleStatusChange}
                onSubmitProof={(task) => setSubmittingEvidenceTask(task)}
                onViewProof={(task) => setViewingEvidenceTask(task)}
              />
            ) : (
              <ListView 
                tasks={filteredTasks} 
                onEdit={openEditModal} 
                onDelete={(id) => setDeletingTaskId(id)} 
                onStatusChange={handleStatusChange}
                onSubmitProof={(task) => setSubmittingEvidenceTask(task)}
                onViewProof={(task) => setViewingEvidenceTask(task)}
              />
            )}

          </main>

          <!-- CREATE / EDIT MODAL -->
          {isCreateModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 relative animate-in fade-in zoom-in-95 duration-150 my-8">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                  <h3 className="text-lg font-bold text-slate-900">
                    {editingTask ? "Edit Task" : "Create New Task"}
                  </h3>
                  <button onClick={closeModal} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTask} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Task Title *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Post promotional story on Instagram"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Description / Instructions
                    </label>
                    <textarea
                      rows="3"
                      placeholder="Add details, steps, or instructions for the person assigned..."
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Assigned Person Name
                      </label>
                      <input
                        type="text"
                        placeholder="e.g., Alex Rivera"
                        value={formData.assignee}
                        onChange={(e) => setFormData({ ...formData, assignee: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Due Date
                      </label>
                      <input
                        type="date"
                        value={formData.dueDate}
                        onChange={(e) => setFormData({ ...formData, dueDate: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Status
                      </label>
                      <select
                        value={formData.status}
                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                        className="w-full px-2 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none"
                      >
                        <option value="backlog">To Do</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Priority
                      </label>
                      <select
                        value={formData.priority}
                        onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                        className="w-full px-2 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none"
                      >
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Type / Routine
                      </label>
                      <select
                        value={formData.type}
                        onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                        className="w-full px-2 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none"
                      >
                        <option value="project">Project Task</option>
                        <option value="daily">Daily Task</option>
                        <option value="weekly">Weekly Task</option>
                        <option value="monthly">Monthly Task</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Expected Link / Deliverable URL (Optional)
                    </label>
                    <input
                      type="url"
                      placeholder="https://..."
                      value={formData.evidenceUrl}
                      onChange={(e) => setFormData({ ...formData, evidenceUrl: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Tags (Comma Separated)
                    </label>
                    <input
                      type="text"
                      placeholder="Marketing, Social Media, Design"
                      value={formData.tags}
                      onChange={(e) => setFormData({ ...formData, tags: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={closeModal}
                      className="px-4 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium rounded-lg"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-md transition"
                    >
                      {editingTask ? "Save Changes" : "Create Task"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <!-- SUBMIT PROOF & WORK DONE MODAL -->
          {submittingEvidenceTask && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 relative animate-in fade-in zoom-in-95 duration-150 my-8">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Submit Finished Work</h3>
                    <p className="text-xs text-slate-500">{submittingEvidenceTask.title}</p>
                  </div>
                  <button onClick={() => setSubmittingEvidenceTask(null)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleEvidenceSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Your Name *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="Enter your name..."
                      value={evidenceForm.submittedBy}
                      onChange={(e) => setEvidenceForm({ ...evidenceForm, submittedBy: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Link to Post or Work (Optional)
                    </label>
                    <input
                      type="url"
                      placeholder="https://instagram.com/p/... or Google Drive Link"
                      value={evidenceForm.evidenceUrl}
                      onChange={(e) => setEvidenceForm({ ...evidenceForm, evidenceUrl: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Upload Photos or Videos (Proof)
                    </label>
                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:bg-slate-50 transition cursor-pointer relative">
                      <input
                        type="file"
                        multiple
                        accept="image/*,video/*"
                        onChange={handleFileUpload}
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                      />
                      <Icon name="upload-cloud" className="w-8 h-8 text-indigo-500 mx-auto mb-1" />
                      <p className="text-xs text-slate-600 font-medium">Click or drag photos/videos here</p>
                      <p className="text-[10px] text-slate-400">PNG, JPG, MP4, MOV supported</p>
                    </div>

                    {evidenceForm.mediaFiles.length > 0 && (
                      <div className="grid grid-cols-4 gap-2 mt-3">
                        {evidenceForm.mediaFiles.map(file => (
                          <div key={file.id} className="relative aspect-square rounded-lg bg-slate-100 overflow-hidden border border-slate-200">
                            {file.type === 'image' ? (
                              <img src={file.dataUrl} className="w-full h-full object-cover" />
                            ) : (
                              <video src={file.dataUrl} className="w-full h-full object-cover" />
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Notes or Comments
                    </label>
                    <textarea
                      rows="2"
                      placeholder="Add any additional notes about what was done..."
                      value={evidenceForm.evidenceNotes}
                      onChange={(e) => setEvidenceForm({ ...evidenceForm, evidenceNotes: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                    ></textarea>
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setSubmittingEvidenceTask(null)}
                      className="px-4 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg shadow-md transition flex items-center gap-2"
                    >
                      <Icon name="check-circle" className="w-4 h-4" />
                      Mark Completed & Submit
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <!-- VIEW PROOF LIGHTBOX MODAL -->
          {viewingEvidenceTask && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 relative animate-in fade-in zoom-in-95 duration-150 my-8">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Submitted Proof of Work</h3>
                    <p className="text-xs text-slate-500">{viewingEvidenceTask.title}</p>
                  </div>
                  <button onClick={() => setViewingEvidenceTask(null)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4">
                  <div className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm">
                    <div>
                      <span className="text-xs text-slate-500 block">Submitted By</span>
                      <span className="font-semibold text-slate-800">{viewingEvidenceTask.assignee || "Team Member"}</span>
                    </div>
                    {viewingEvidenceTask.completedAt && (
                      <div className="text-right">
                        <span className="text-xs text-slate-500 block">Completed On</span>
                        <span className="font-medium text-slate-700">
                          {new Date(viewingEvidenceTask.completedAt).toLocaleDateString()}
                        </span>
                      </div>
                    )}
                  </div>

                  {viewingEvidenceTask.evidenceUrl && (
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">External Deliverable Link</label>
                      <a
                        href={viewingEvidenceTask.evidenceUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-800 font-medium text-sm underline break-all bg-indigo-50 px-3 py-2 rounded-lg w-full"
                      >
                        <Icon name="external-link" className="w-4 h-4 shrink-0" />
                        {viewingEvidenceTask.evidenceUrl}
                      </a>
                    </div>
                  )}

                  {viewingEvidenceTask.evidenceNotes && (
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Completion Notes</label>
                      <p className="text-sm text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200">
                        {viewingEvidenceTask.evidenceNotes}
                      </p>
                    </div>
                  )}

                  {viewingEvidenceTask.evidenceMedia && viewingEvidenceTask.evidenceMedia.length > 0 && (
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Attached Photos & Videos</label>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        {viewingEvidenceTask.evidenceMedia.map(item => (
                          <div key={item.id} className="rounded-xl overflow-hidden border border-slate-200 bg-black aspect-video relative group">
                            {item.type === 'image' ? (
                              <img src={item.dataUrl} className="w-full h-full object-cover" />
                            ) : (
                              <video src={item.dataUrl} controls className="w-full h-full object-cover" />
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex justify-end pt-4 border-t border-slate-100 mt-6">
                  <button
                    onClick={() => setViewingEvidenceTask(null)}
                    className="px-5 py-2 bg-slate-800 text-white text-sm font-semibold rounded-lg shadow-sm hover:bg-slate-900"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          <!-- CONFIRM DELETE DIALOG -->
          {deletingTaskId && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center animate-in fade-in zoom-in-95 duration-150">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3">
                  <Icon name="trash-2" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-slate-900 mb-1">Delete Task?</h3>
                <p className="text-xs text-slate-500 mb-6">Are you sure you want to delete this task? You can undo this action shortly after.</p>
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setDeletingTaskId(null)}
                    className="flex-1 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium border border-slate-200 rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => confirmDeleteTask(deletingTaskId)}
                    className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-lg shadow-sm"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          <!-- UNDO TOAST NOTIFICATION -->
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-in slide-in-from-bottom-5 duration-200">
              <span className="text-sm font-medium">{toast.message}</span>
              {toast.hasUndo && (
                <button
                  onClick={undoDelete}
                  className="px-2.5 py-1 bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-bold rounded-md transition"
                >
                  Undo
                </button>
              )}
            </div>
          )}

        </div>
      );
    }

    // --- KANBAN BOARD VIEW ---
    function KanbanView({ tasks, onEdit, onDelete, onStatusChange, onSubmitProof, onViewProof }) {
      const columns = [
        { id: "backlog", title: "To Do", color: "bg-slate-500" },
        { id: "in_progress", title: "In Progress", color: "bg-amber-500" },
        { id: "completed", title: "Completed", color: "bg-emerald-500" }
      ];

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          {columns.map(col => {
            const colTasks = tasks.filter(t => t.status === col.id);
            return (
              <div key={col.id} className="bg-slate-100/70 p-4 rounded-2xl border border-slate-200/80 flex flex-col min-h-[500px]">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <span className={`w-3 h-3 rounded-full ${col.color}`}></span>
                    <h2 className="font-bold text-slate-800 text-sm uppercase tracking-wider">{col.title}</h2>
                  </div>
                  <span className="bg-white px-2.5 py-0.5 rounded-full text-xs font-bold text-slate-600 shadow-sm border border-slate-200">
                    {colTasks.length}
                  </span>
                </div>

                <div className="space-y-3 flex-1">
                  {colTasks.map(task => (
                    <TaskCard 
                      key={task.id} 
                      task={task} 
                      onEdit={onEdit} 
                      onDelete={onDelete} 
                      onStatusChange={onStatusChange}
                      onSubmitProof={onSubmitProof}
                      onViewProof={onViewProof}
                    />
                  ))}
                  {colTasks.length === 0 && (
                    <div className="border-2 border-dashed border-slate-200 rounded-xl h-32 flex items-center justify-center text-slate-400 text-xs font-medium">
                      No tasks in this stage
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // --- TASK CARD COMPONENT (HIGH VISIBILITY ACTIONS) ---
    function TaskCard({ task, onEdit, onDelete, onStatusChange, onSubmitProof, onViewProof }) {
      const priorityColors = {
        high: "bg-rose-100 text-rose-700 border-rose-200",
        medium: "bg-amber-100 text-amber-700 border-amber-200",
        low: "bg-slate-100 text-slate-700 border-slate-200"
      };

      const hasProof = task.evidenceUrl || task.evidenceNotes || (task.evidenceMedia && task.evidenceMedia.length > 0);

      return (
        <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200 hover:shadow-md transition relative group">
          
          <!-- PROMINENT EDIT & DELETE BAR -->
          <div className="flex items-center justify-between pb-2 border-b border-slate-100 mb-3">
            <span className={`text-[10px] uppercase font-extrabold px-2 py-0.5 rounded border ${priorityColors[task.priority]}`}>
              {task.priority} Priority
            </span>

            <!-- HIGH VISIBILITY BUTTONS -->
            <div className="flex items-center gap-1.5">
              <button
                onClick={() => onEdit(task)}
                className="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs rounded border border-indigo-200 transition flex items-center gap-1"
                title="Edit Task"
              >
                <Icon name="pencil" className="w-3.5 h-3.5" />
                Edit
              </button>
              <button
                onClick={() => onDelete(task.id)}
                className="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs rounded border border-rose-200 transition flex items-center gap-1"
                title="Delete Task"
              >
                <Icon name="trash-2" className="w-3.5 h-3.5" />
                Delete
              </button>
            </div>
          </div>

          <h3 className="font-bold text-slate-900 text-sm mb-1 leading-snug">{task.title}</h3>
          {task.description && (
            <p className="text-xs text-slate-500 line-clamp-2 mb-3 leading-relaxed">{task.description}</p>
          )}

          <!-- Assigned Person Name -->
          <div className="flex items-center justify-between text-xs text-slate-600 mb-3 bg-slate-50 p-2 rounded-lg border border-slate-100">
            <span className="text-slate-400 font-medium">Assigned To:</span>
            <span className="font-semibold text-slate-800">{task.assignee || "Unassigned"}</span>
          </div>

          <!-- Proof / Submission Badge or Action -->
          {hasProof ? (
            <button
              onClick={() => onViewProof(task)}
              className="w-full py-1.5 px-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 mb-3 transition"
            >
              <Icon name="eye" className="w-3.5 h-3.5" />
              View Proof / Evidence
            </button>
          ) : (
            <button
              onClick={() => onSubmitProof(task)}
              className="w-full py-1.5 px-3 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 mb-3 transition shadow-sm"
            >
              <Icon name="upload" className="w-3.5 h-3.5" />
              Submit Work / Proof
            </button>
          )}

          <!-- Quick Move Buttons -->
          <div className="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
            <span className="text-[11px] text-slate-400">Move:</span>
            <div className="flex gap-1">
              {task.status !== 'backlog' && (
                <button
                  onClick={() => onStatusChange(task.id, 'backlog')}
                  className="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-[11px] font-medium"
                >
                  To Do
                </button>
              )}
              {task.status !== 'in_progress' && (
                <button
                  onClick={() => onStatusChange(task.id, 'in_progress')}
                  className="px-2 py-0.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded text-[11px] font-medium"
                >
                  Doing
                </button>
              )}
              {task.status !== 'completed' && (
                <button
                  onClick={() => onStatusChange(task.id, 'completed')}
                  className="px-2 py-0.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded text-[11px] font-medium"
                >
                  Done
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- LIST / TABLE VIEW ---
    function ListView({ tasks, onEdit, onDelete, onStatusChange, onSubmitProof, onViewProof }) {
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                  <th className="py-3.5 px-4">Task</th>
                  <th className="py-3.5 px-4">Assigned Name</th>
                  <th className="py-3.5 px-4">Status</th>
                  <th className="py-3.5 px-4">Priority</th>
                  <th className="py-3.5 px-4">Proof / Work Link</th>
                  <th className="py-3.5 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-sm">
                {tasks.map(task => (
                  <tr key={task.id} className="hover:bg-slate-50/80 transition">
                    <td className="py-3.5 px-4">
                      <div className="font-semibold text-slate-900">{task.title}</div>
                      {task.dueDate && <div className="text-xs text-slate-400">Due: {task.dueDate}</div>}
                    </td>
                    <td className="py-3.5 px-4 font-medium text-slate-700">
                      {task.assignee || "Unassigned"}
                    </td>
                    <td className="py-3.5 px-4">
                      <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                        task.status === 'completed' ? 'bg-emerald-100 text-emerald-700' :
                        task.status === 'in_progress' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-700'
                      }`}>
                        {task.status.replace('_', ' ')}
                      </span>
                    </td>
                    <td className="py-3.5 px-4 uppercase text-xs font-bold text-slate-600">
                      {task.priority}
                    </td>
                    <td className="py-3.5 px-4">
                      {task.evidenceUrl || task.evidenceNotes || (task.evidenceMedia && task.evidenceMedia.length > 0) ? (
                        <button
                          onClick={() => onViewProof(task)}
                          className="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-semibold hover:bg-emerald-100"
                        >
                          <Icon name="eye" className="w-3.5 h-3.5" />
                          View Proof
                        </button>
                      ) : (
                        <button
                          onClick={() => onSubmitProof(task)}
                          className="inline-flex items-center gap-1 px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-medium hover:bg-slate-200"
                        >
                          <Icon name="upload" className="w-3.5 h-3.5" />
                          Submit Proof
                        </button>
                      )}
                    </td>
                    <td className="py-3.5 px-4 text-right">
                      <div className="flex items-center justify-end gap-2">
                        <button
                          onClick={() => onEdit(task)}
                          className="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs rounded border border-indigo-200 transition"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => onDelete(task.id)}
                          className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs rounded border border-rose-200 transition"
                        >
                          Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
                {tasks.length === 0 && (
                  <tr>
                    <td colSpan="6" className="py-8 text-center text-slate-400 text-sm">
                      No matching tasks found.
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
