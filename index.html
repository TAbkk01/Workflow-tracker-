<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Collaborative Workflow Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    // Safely check for real platform injected Firebase config
    const hasRealConfig = typeof __firebase_config !== 'undefined' && __firebase_config && __firebase_config.trim() !== '';
    let auth = null, db = null, storage = null;
    let isRealFirebase = false;

    if (hasRealConfig) {
      try {
        const configObj = JSON.parse(__firebase_config);
        const app = initializeApp(configObj);
        auth = getAuth(app);
        db = getFirestore(app);
        storage = getStorage(app);
        isRealFirebase = true;
      } catch (err) {
        console.warn("Firebase initialization failed, falling back to LocalStorage mode:", err);
      }
    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-workflow-app';

    window.FirebaseServices = {
      isRealFirebase,
      auth,
      db,
      storage,
      appId,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      collection,
      doc,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      ref,
      uploadBytes,
      getDownloadURL
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Default sample tasks for local GitHub mode
    const INITIAL_SAMPLE_TASKS = [
      {
        id: 'sample-1',
        title: 'Design Landing Page Banner',
        description: 'Create responsive hero layout options for client approval.',
        status: 'in_progress',
        priority: 'high',
        assignee: 'Alex Rivera',
        dueDate: '2026-10-15',
        isRecurring: false,
        createdAt: '2026-09-29'
      },
      {
        id: 'sample-2',
        title: 'Weekly Team Standup',
        description: 'Sync team deliverables and update weekly roadmap statuses.',
        status: 'backlog',
        priority: 'medium',
        assignee: 'Sarah Chen',
        dueDate: '2026-10-05',
        isRecurring: true,
        frequency: 'weekly',
        createdAt: '2026-09-29'
      }
    ];

    const STAGES = [
      { id: 'backlog', name: 'Backlog', badge: 'bg-slate-100 text-slate-700 border-slate-200' },
      { id: 'in_progress', name: 'In Progress', badge: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'in_review', name: 'In Review', badge: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'completed', name: 'Approved & Done', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
    ];

    const PRIORITIES = {
      low: { label: 'Low', color: 'bg-slate-100 text-slate-600 border-slate-200', order: 1 },
      medium: { label: 'Medium', color: 'bg-blue-100 text-blue-700 border-blue-200', order: 2 },
      high: { label: 'High', color: 'bg-amber-100 text-amber-700 border-amber-200', order: 3 },
      urgent: { label: 'Urgent', color: 'bg-rose-100 text-rose-700 border-rose-200', order: 4 }
    };

    const FREQUENCIES = {
      daily: { label: 'Daily', badge: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
      weekly: { label: 'Weekly', badge: 'bg-purple-50 text-purple-700 border-purple-200' },
      monthly: { label: 'Monthly', badge: 'bg-teal-50 text-teal-700 border-teal-200' }
    };

    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        layers: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        ),
        clock: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        alertCircle: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        checkCircle: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        repeat: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        ),
        search: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        ),
        plus: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
          </svg>
        ),
        edit: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        ),
        fileText: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        ),
        uploadCloud: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
        ),
        user: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        ),
        calendar: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        ),
        x: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        ),
        externalLink: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        ),
        database: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8-4m0 5c0 2.21 3.582 4 8 4s8-1.79 8-4" />
          </svg>
        ),
        download: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
        )
      };
      return icons[name] || null;
    }

    function App() {
      const [user, setUser] = useState(null);
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);

      // Default to LocalStorage mode if real Firebase config is absent (GitHub Pages)
      const [isLocalMode, setIsLocalMode] = useState(() => {
        return !window.FirebaseServices?.isRealFirebase;
      });

      const [activeTab, setActiveTab] = useState('main'); // 'main' | 'recurring'
      const [viewMode, setViewMode] = useState('kanban'); // 'kanban' | 'list'
      const [recurringFrequency, setRecurringFrequency] = useState('all');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStatus, setSelectedStatus] = useState('all');
      const [selectedPriority, setSelectedPriority] = useState('all');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [submittingTask, setSubmittingTask] = useState(null);
      const [reviewingTask, setReviewingTask] = useState(null);
      const [taskToDelete, setTaskToDelete] = useState(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Helper to persist local tasks when hosted on GitHub Pages
      const saveLocalTasks = (updatedTasks) => {
        setTasks(updatedTasks);
        try {
          localStorage.setItem('workflow_tracker_tasks', JSON.stringify(updatedTasks));
        } catch (e) {
          console.error("LocalStorage write error:", e);
        }
      };

      // Export workspace data as a downloadable JSON backup for Google Drive
      const handleExportJSON = () => {
        const backupData = {
          app: 'Collaborative Workflow Tracker',
          exportedAt: new Date().toISOString(),
          taskCount: tasks.length,
          tasks: tasks
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `workflow_tracker_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Workspace exported! Save this file to your Google Drive.', 'success');
      };

      // Import workspace data from Google Drive / JSON backup file
      const handleImportJSON = (jsonString, mode = 'overwrite') => {
        try {
          const parsed = JSON.parse(jsonString);
          const importedTasks = Array.isArray(parsed) ? parsed : (parsed.tasks || []);
          if (!Array.isArray(importedTasks)) throw new Error('Invalid backup file format');

          let finalTasks;
          if (mode === 'merge') {
            const existingIds = new Set(tasks.map(t => t.id));
            const newItems = importedTasks.filter(t => !existingIds.has(t.id));
            finalTasks = [...tasks, ...newItems];
          } else {
            finalTasks = importedTasks;
          }

          saveLocalTasks(finalTasks);
          showToast(`Successfully loaded ${importedTasks.length} tasks from backup!`, 'success');
          setIsBackupModalOpen(false);
        } catch (e) {
          showToast('Failed to parse backup JSON. Please check file format.', 'error');
        }
      };

      // Initial Auth and Task Loading
      useEffect(() => {
        const services = window.FirebaseServices || {};

        if (!services.isRealFirebase) {
          // Load from LocalStorage for standalone / GitHub Pages hosting
          try {
            const saved = localStorage.getItem('workflow_tracker_tasks');
            if (saved) {
              setTasks(JSON.parse(saved));
            } else {
              setTasks(INITIAL_SAMPLE_TASKS);
              localStorage.setItem('workflow_tracker_tasks', JSON.stringify(INITIAL_SAMPLE_TASKS));
            }
          } catch (e) {
            setTasks(INITIAL_SAMPLE_TASKS);
          }
          setLoading(false);
          return;
        }

        const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = services;

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Auth initialization error, switching to LocalStorage mode:", e);
            setIsLocalMode(true);
          }
        };

        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
        });

        return () => unsubscribe();
      }, []);

      // Real-time Firestore Sync (or LocalStorage fallback)
      useEffect(() => {
        if (isLocalMode) return;
        if (!user) return;

        const { db, appId, collection, onSnapshot } = window.FirebaseServices;
        const tasksCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');

        setLoading(true);
        const unsubscribe = onSnapshot(tasksCollectionRef, (snapshot) => {
          const loadedTasks = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          setTasks(loadedTasks);
          setLoading(false);
        }, (error) => {
          console.warn("Firestore snapshot listener failed, falling back to LocalStorage:", error);
          setIsLocalMode(true);
          try {
            const saved = localStorage.getItem('workflow_tracker_tasks');
            setTasks(saved ? JSON.parse(saved) : INITIAL_SAMPLE_TASKS);
          } catch (e) {
            setTasks(INITIAL_SAMPLE_TASKS);
          }
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user, isLocalMode]);

      const handleSaveTask = async (taskData) => {
        if (isLocalMode) {
          if (editingTask) {
            const updated = tasks.map(t => t.id === editingTask.id ? { ...t, ...taskData } : t);
            saveLocalTasks(updated);
            showToast('Task updated successfully!', 'success');
          } else {
            const newTask = {
              id: 'task-' + Date.now(),
              ...taskData,
              evidenceFiles: [],
              createdAt: new Date().toISOString().split('T')[0]
            };
            saveLocalTasks([newTask, ...tasks]);
            showToast('New task added!', 'success');
          }
          setIsModalOpen(false);
          setEditingTask(null);
          return;
        }

        if (!user) return;
        const { db, appId, collection, doc, setDoc, addDoc } = window.FirebaseServices;

        try {
          if (editingTask) {
            const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', editingTask.id);
            await setDoc(taskDocRef, { ...editingTask, ...taskData }, { merge: true });
            showToast('Task updated successfully!', 'success');
          } else {
            const tasksCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
            await addDoc(tasksCollectionRef, {
              ...taskData,
              evidenceFiles: [],
              createdAt: new Date().toISOString().split('T')[0]
            });
            showToast('New task added!', 'success');
          }
        } catch (e) {
          console.error("Error saving task in Firestore, falling back locally:", e);
          setIsLocalMode(true);
          if (editingTask) {
            const updated = tasks.map(t => t.id === editingTask.id ? { ...t, ...taskData } : t);
            saveLocalTasks(updated);
          } else {
            const newTask = {
              id: 'task-' + Date.now(),
              ...taskData,
              evidenceFiles: [],
              createdAt: new Date().toISOString().split('T')[0]
            };
            saveLocalTasks([newTask, ...tasks]);
          }
          showToast('Task saved locally!', 'success');
        }

        setIsModalOpen(false);
        setEditingTask(null);
      };

      const confirmDeleteTask = async () => {
        if (isLocalMode) {
          const updated = tasks.filter(t => t.id !== taskToDelete.id);
          saveLocalTasks(updated);
          showToast('Task removed', 'info');
          setTaskToDelete(null);
          return;
        }

        if (!user || !taskToDelete) return;
        const { db, appId, doc, deleteDoc } = window.FirebaseServices;

        try {
          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskToDelete.id);
          await deleteDoc(taskDocRef);
          showToast('Task removed', 'info');
        } catch (e) {
          console.error("Error deleting task:", e);
          const updated = tasks.filter(t => t.id !== taskToDelete.id);
          saveLocalTasks(updated);
          showToast('Task removed locally', 'info');
        }

        setTaskToDelete(null);
      };

      const handleMoveStage = async (taskId, newStatus) => {
        if (isLocalMode) {
          const updated = tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t);
          saveLocalTasks(updated);
          const stageName = STAGES.find(s => s.id === newStatus)?.name;
          showToast(`Moved task to ${stageName}`, 'info');
          return;
        }

        if (!user) return;
        const { db, appId, doc, updateDoc } = window.FirebaseServices;

        try {
          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId);
          await updateDoc(taskDocRef, { status: newStatus });
          const stageName = STAGES.find(s => s.id === newStatus)?.name;
          showToast(`Moved task to ${stageName}`, 'info');
        } catch (e) {
          console.error("Error moving stage:", e);
          const updated = tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t);
          saveLocalTasks(updated);
        }
      };

      const handleSubmitEvidence = async (taskId, submissionData) => {
        const targetTask = tasks.find(t => t.id === taskId);
        const existingFiles = targetTask?.evidenceFiles || [];

        const processLocalFiles = async (newFiles) => {
          if (!newFiles || newFiles.length === 0) return [];
          const items = [];
          for (const f of newFiles) {
            if (f.rawFile) {
              const readDataUrl = (file) => new Promise((res) => {
                const r = new FileReader();
                r.onload = (e) => res(e.target.result);
                r.readAsDataURL(file);
              });
              const dataUrl = await readDataUrl(f.rawFile);
              items.push({ id: 'file-' + Date.now(), name: f.name, type: f.rawFile.type, dataUrl });
            }
          }
          return items;
        };

        if (isLocalMode) {
          const newProcessedFiles = await processLocalFiles(submissionData.newFiles);
          const updatedTasks = tasks.map(t => {
            if (t.id === taskId) {
              return {
                ...t,
                status: submissionData.markCompletedImmediately ? 'completed' : 'in_review',
                evidenceUrl: submissionData.evidenceUrl || t.evidenceUrl || '',
                evidenceFiles: [...existingFiles, ...newProcessedFiles],
                submitterNotes: submissionData.submitterNotes || '',
                submittedAt: new Date().toLocaleString(),
                submittedBy: submissionData.submittedBy || 'Team Member'
              };
            }
            return t;
          });
          saveLocalTasks(updatedTasks);
          showToast('Proof submitted for review!', 'success');
          setSubmittingTask(null);
          return;
        }

        if (!user) return;
        const { db, storage, appId, doc, updateDoc, ref, uploadBytes, getDownloadURL } = window.FirebaseServices;

        try {
          const uploadedFileUrls = [];

          if (submissionData.newFiles && submissionData.newFiles.length > 0) {
            for (const fileObj of submissionData.newFiles) {
              if (fileObj.rawFile) {
                try {
                  const storageRef = ref(storage, `evidence/${appId}/${Date.now()}_${fileObj.rawFile.name}`);
                  await uploadBytes(storageRef, fileObj.rawFile);
                  const downloadUrl = await getDownloadURL(storageRef);
                  uploadedFileUrls.push({
                    id: `file-${Date.now()}`,
                    name: fileObj.rawFile.name,
                    type: fileObj.rawFile.type,
                    dataUrl: downloadUrl
                  });
                } catch (err) {
                  const readDataUrl = (file) => new Promise((res) => {
                    const r = new FileReader();
                    r.onload = (e) => res(e.target.result);
                    r.readAsDataURL(file);
                  });
                  const dataUrl = await readDataUrl(fileObj.rawFile);
                  uploadedFileUrls.push({
                    id: `file-${Date.now()}`,
                    name: fileObj.rawFile.name,
                    type: fileObj.rawFile.type,
                    dataUrl
                  });
                }
              }
            }
          }

          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId);
          await updateDoc(taskDocRef, {
            status: submissionData.markCompletedImmediately ? 'completed' : 'in_review',
            evidenceUrl: submissionData.evidenceUrl || targetTask?.evidenceUrl || '',
            evidenceFiles: [...existingFiles, ...uploadedFileUrls],
            submitterNotes: submissionData.submitterNotes || '',
            submittedAt: new Date().toLocaleString(),
            submittedBy: submissionData.submittedBy || 'Team Member'
          });

          showToast('Proof submitted for review!', 'success');
        } catch (e) {
          console.error("Error submitting evidence:", e);
          const newProcessedFiles = await processLocalFiles(submissionData.newFiles);
          const updatedTasks = tasks.map(t => {
            if (t.id === taskId) {
              return {
                ...t,
                status: submissionData.markCompletedImmediately ? 'completed' : 'in_review',
                evidenceUrl: submissionData.evidenceUrl || t.evidenceUrl || '',
                evidenceFiles: [...existingFiles, ...newProcessedFiles],
                submitterNotes: submissionData.submitterNotes || '',
                submittedAt: new Date().toLocaleString(),
                submittedBy: submissionData.submittedBy || 'Team Member'
              };
            }
            return t;
          });
          saveLocalTasks(updatedTasks);
          showToast('Proof saved locally!', 'success');
        }

        setSubmittingTask(null);
      };

      const handleApproveReject = async (taskId, newStatus, feedback = '') => {
        if (isLocalMode) {
          const updated = tasks.map(t => t.id === taskId ? { ...t, status: newStatus, reviewFeedback: feedback } : t);
          saveLocalTasks(updated);
          if (newStatus === 'completed') {
            showToast('Work approved & marked complete!', 'success');
          } else {
            showToast('Revisions requested.', 'info');
          }
          setReviewingTask(null);
          return;
        }

        if (!user) return;
        const { db, appId, doc, updateDoc } = window.FirebaseServices;

        try {
          const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', taskId);
          await updateDoc(taskDocRef, { 
            status: newStatus,
            reviewFeedback: feedback
          });
          
          if (newStatus === 'completed') {
            showToast('Work approved & marked complete!', 'success');
          } else {
            showToast('Revisions requested.', 'info');
          }
        } catch (e) {
          console.error("Error updating status:", e);
          const updated = tasks.map(t => t.id === taskId ? { ...t, status: newStatus, reviewFeedback: feedback } : t);
          saveLocalTasks(updated);
        }

        setReviewingTask(null);
      };

      // Filtered Tasks Memo
      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          if (activeTab === 'recurring' && !task.isRecurring) return false;
          if (activeTab === 'recurring' && recurringFrequency !== 'all' && task.frequency !== recurringFrequency) {
            return false;
          }

          const matchesSearch = 
            (task.title || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.description || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.assignee || '').toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesStatus = selectedStatus === 'all' || task.status === selectedStatus;
          const matchesPriority = selectedPriority === 'all' || task.priority === selectedPriority;

          return matchesSearch && matchesStatus && matchesPriority;
        });
      }, [tasks, activeTab, recurringFrequency, searchQuery, selectedStatus, selectedPriority]);

      // Metrics Summary
      const metrics = useMemo(() => {
        return {
          total: tasks.length,
          inProgress: tasks.filter(t => t.status === 'in_progress').length,
          inReview: tasks.filter(t => t.status === 'in_review').length,
          completed: tasks.filter(t => t.status === 'completed').length
        };
      }, [tasks]);

      return (
        <div className="min-h-screen flex flex-col font-sans pb-12">
          
          {/* Top Header Navbar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                  <Icon name="layers" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight flex items-center space-x-2">
                    <span>Collaborative Workflow Tracker</span>
                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase border border-emerald-200 flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      {isLocalMode ? 'GitHub Local Sync' : 'Live Cloud Sync'}

                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button

                  title="Google Drive & Cloud Sync Options"
                >
                  <Icon name="database" className="w-4 h-4 text-indigo-600" />
                  <span className="hidden sm:inline">Drive & Cloud Sync</span>
                </button>

                <button
                  onClick={() => {
                    setEditingTask(null);
                    setIsModalOpen(true);
                  }}

                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>New Shared Task</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col space-y-6">
            
            {/* Quick Metrics Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-slate-100 text-slate-700">
                  <Icon name="layers" className="w-5 h-5" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-500">Total Tasks</div>
                  <div className="text-lg font-extrabold text-slate-900">{metrics.total}</div>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-blue-50 text-blue-600">
                  <Icon name="clock" className="w-5 h-5" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-500">In Progress</div>
                  <div className="text-lg font-extrabold text-blue-600">{metrics.inProgress}</div>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">
                <div className="p-2.5 rounded-xl bg-amber-50 text-amber-600">
                  <Icon name="alertCircle" className="w-5 h-5" />
                </div>
                <div>

                  <div className="text-lg font-extrabold text-amber-600">{metrics.inReview}</div>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-3">

                  <Icon name="checkCircle" className="w-5 h-5" />

                <div>

                  <div className="text-lg font-extrabold text-emerald-600">{metrics.completed}</div>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-3">
              
              {/* Active Tab Switcher */}
              <div className="flex space-x-4">
                <button
                  onClick={() => setActiveTab('main')}
                  className={`text-xs sm:text-sm font-bold pb-2 border-b-2 transition-all cursor-pointer flex items-center space-x-1.5 ${

                >
                  <Icon name="layers" className="w-4 h-4" />

                  <Icon name="repeat" className="w-4 h-4" />

              </div>

              {activeTab === 'main' && (

                  <button

                  type="text"
                  placeholder="Search tasks, assignee, descriptions..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}

              <div className="flex flex-wrap items-center gap-2">

                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>

                  <select

                    className="text-xs border border-slate-200 bg-white rounded-xl px-3 py-2 text-slate-700 font-semibold focus:outline-none"
                  >
                    <option value="all">All Stages</option>
                    {STAGES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                )}

                <select
                  value={selectedPriority}
                  onChange={(e) => setSelectedPriority(e.target.value)}
                  className="text-xs border border-slate-200 bg-white rounded-xl px-3 py-2 text-slate-700 font-semibold focus:outline-none"
                >
                  <option value="all">All Priorities</option>
                  {Object.keys(PRIORITIES).map(p => <option key={p} value={p}>{PRIORITIES[p].label}</option>)}
                </select>

                {(searchQuery || selectedStatus !== 'all' || selectedPriority !== 'all' || recurringFrequency !== 'all') && (
                  <button
                    onClick={() => {
                      setSearchQuery('');
                      setSelectedStatus('all');
                      setSelectedPriority('all');
                      setRecurringFrequency('all');
                    }}
                    className="text-xs font-semibold text-rose-600 hover:text-rose-800 px-2 py-1 cursor-pointer"
                  >
                    Clear Filters
                  </button>
                )}
              </div>
            </div>

            {}
            {loading ? (
              <div className="text-center py-20 text-slate-500 font-medium animate-pulse">
                Syncing workspace tasks...
              </div>
            ) : filteredTasks.length === 0 ? (
              <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-2xs">
                <Icon name="layers" className="w-10 h-10 text-slate-300 mx-auto mb-3" />
                <p className="text-slate-700 font-bold text-sm">No tasks found matching current filters.</p>
                <p className="text-slate-400 text-xs mt-1">Create a task or clear filter criteria to see existing items.</p>
              </div>
            ) : viewMode === 'kanban' || activeTab === 'recurring' ? (
              <KanbanView
                tasks={filteredTasks}
                stages={STAGES}
                onMoveStage={handleMoveStage}
                onOpenSubmitModal={setSubmittingTask}
                onOpenReviewModal={setReviewingTask}
                onEditTask={(task) => { setEditingTask(task); setIsModalOpen(true); }}
                onDeleteTask={setTaskToDelete}
              />
            ) : (
              <TableView
                tasks={filteredTasks}
                stages={STAGES}
                onMoveStage={handleMoveStage}
                onOpenSubmitModal={setSubmittingTask}
                onOpenReviewModal={setReviewingTask}
                onEditTask={(task) => { setEditingTask(task); setIsModalOpen(true); }}
                onDeleteTask={setTaskToDelete}
              />
            )}
          </main>

          {}
          {isModalOpen && (
            <TaskModal
              task={editingTask}
              stages={STAGES}
              onClose={() => { setIsModalOpen(false); setEditingTask(null); }}
              onSave={handleSaveTask}
            />
          )}

          {isBackupModalOpen && (
            <CloudBackupModal
              tasks={tasks}
              isLocalMode={isLocalMode}
              onClose={() => setIsBackupModalOpen(false)}
              onExport={handleExportJSON}
              onImport={handleImportJSON}
            />
          )}

          {submittingTask && (
            <SubmitProofModal
              task={submittingTask}
              onClose={() => setSubmittingTask(null)}
              onSubmit={(data) => handleSubmitEvidence(submittingTask.id, data)}
            />
          )}

          {reviewingTask && (
            <ReviewProofModal
              task={reviewingTask}
              onClose={() => setReviewingTask(null)}
              onApprove={() => handleApproveReject(reviewingTask.id, 'completed')}
              onReject={(feedback) => handleApproveReject(reviewingTask.id, 'in_progress', feedback)}
            />
          )}

          {taskToDelete && (
            <DeleteModal
              taskTitle={taskToDelete.title}
              onConfirm={confirmDeleteTask}
              onCancel={() => setTaskToDelete(null)}
            />
          )}

          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold text-white transition-all transform animate-fade-in ${
              toast.type === 'success' ? 'bg-emerald-600' : toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-800'
            }`}>
              {toast.message}
            </div>
          )}
        </div>
      );
    }

    function KanbanView({ tasks, stages, onMoveStage, onOpenSubmitModal, onOpenReviewModal, onEditTask, onDeleteTask }) {

    function TableView({ tasks, stages, onMoveStage, onOpenSubmitModal, onOpenReviewModal, onEditTask, onDeleteTask }) {
      return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-x-auto">

                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function TaskModal({ task, stages, onClose, onSave }) {
      const [title, setTitle] = useState(task?.title || '');
      const [description, setDescription] = useState(task?.description || '');
      const [status, setStatus] = useState(task?.status || 'backlog');
      const [priority, setPriority] = useState(task?.priority || 'medium');
      const [assignee, setAssignee] = useState(task?.assignee || '');
      const [dueDate, setDueDate] = useState(task?.dueDate || '');
      const [isRecurring, setIsRecurring] = useState(task?.isRecurring || false);
      const [frequency, setFrequency] = useState(task?.frequency || 'daily');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onSave({ 
          title: title.trim(), 
          description, 
          status, 
          priority, 
          assignee, 
          dueDate, 
          isRecurring, 
          frequency 
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4 text-xs animate-fade-in">
            
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="font-bold text-base text-slate-900">{task ? 'Edit Shared Task' : 'Create New Shared Task'}</h3>
              <button type="button" onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            
            <div>
              <label className="font-semibold text-slate-700 block mb-1">Task Title *</label>
              <input
                type="text"
                required
                placeholder="e.g. Design Landing Page Banner"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium text-xs"
              />
            </div>

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Description / Requirements</label>
              <textarea
                rows={3}
                placeholder="Details, deliverables expected, specs..."
                value={description}
                onChange={(e) => setDescription(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium text-xs"
              />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="font-semibold text-slate-700 block mb-1">Stage Column</label>
                <select
                  value={status}
                  onChange={(e) => setStatus(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none text-xs font-semibold"
                >
                  {stages.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>

              <div>
                <label className="font-semibold text-slate-700 block mb-1">Priority</label>
                <select
                  value={priority}
                  onChange={(e) => setPriority(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none text-xs font-semibold"
                >
                  {Object.keys(PRIORITIES).map(p => <option key={p} value={p}>{PRIORITIES[p].label}</option>)}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="font-semibold text-slate-700 block mb-1">Assigned Person</label>
                <input
                  type="text"
                  placeholder="e.g. Alex Smith"
                  value={assignee}
                  onChange={(e) => setAssignee(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none text-xs"
                />
              </div>
              <div>
                <label className="font-semibold text-slate-700 block mb-1">Target Due Date</label>
                <input
                  type="date"
                  value={dueDate}
                  onChange={(e) => setDueDate(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none text-xs"
                />
              </div>
            </div>

            <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
              <label className="flex items-center space-x-2 cursor-pointer">
                <input
                  type="checkbox"
                  checked={isRecurring}
                  onChange={(e) => setIsRecurring(e.target.checked)}
                  className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                />
                <span className="font-bold text-slate-800">Recurring Task Schedule</span>
              </label>

              {isRecurring && (
                <div className="pt-2">
                  <label className="font-semibold text-slate-600 block mb-1">Frequency</label>
                  <select
                    value={frequency}
                    onChange={(e) => setFrequency(e.target.value)}
                    className="w-full px-3 py-1.5 border border-slate-200 bg-white rounded-lg text-xs font-semibold"
                  >
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                  </select>
                </div>
              )}
            </div>

            <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
              <button 
                type="button"
                onClick={onClose} 
                className="px-4 py-2 border border-slate-200 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"
              >
                Cancel
              </button>
              <button 
                type="submit"
                className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-all shadow-xs cursor-pointer"
              >
                Save Task
              </button>
            </div>

          </form>
        </div>
      );
    }

    function SubmitProofModal({ task, onClose, onSubmit }) {
      const [submitterName, setSubmitterName] = useState(task.assignee || '');
      const [evidenceUrl, setEvidenceUrl] = useState(task.evidenceUrl || '');
      const [submitterNotes, setSubmitterNotes] = useState(task.submitterNotes || '');
      const [files, setFiles] = useState([]);

      const handleFileChange = (e) => {
        const selected = Array.from(e.target.files);
        const processed = selected.map(file => {
          const isImg = file.type.startsWith('image/');
          return {
            rawFile: file,
            name: file.name,
            previewUrl: isImg ? URL.createObjectURL(file) : ''
          };
        });
        setFiles(prev => [...prev, ...processed]);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit({ submittedBy: submitterName, evidenceUrl, submitterNotes, newFiles: files });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4 text-xs animate-fade-in">
            
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="font-bold text-base text-slate-900">Submit Deliverable Proof</h3>
                <p className="text-slate-500 text-[11px] font-medium mt-0.5">Task: {task.title}</p>
              </div>
              <button type="button" onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Your Name *</label>
              <input
                type="text"
                required
                placeholder="Your Name"
                value={submitterName}
                onChange={(e) => setSubmitterName(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Link to Deliverable / Published Post / Document</label>
              <input
                type="url"
                placeholder="https://..."
                value={evidenceUrl}
                onChange={(e) => setEvidenceUrl(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Attach Media or Document Files</label>
              <input
                type="file"
                multiple
                accept="image/*,video/*,.pdf"
                onChange={handleFileChange}
                className="w-full text-xs text-slate-500 border border-slate-200 rounded-xl p-2 bg-slate-50"
              />
            </div>

            {files.length > 0 && (
              <div className="flex flex-wrap gap-2 pt-1">
                {files.map((f, idx) => (
                  <span key={idx} className="bg-slate-100 text-slate-700 text-[10px] px-2 py-1 rounded-md border border-slate-200">
                    {f.name}
                  </span>
                ))}
              </div>
            )}

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Submission Notes / Deliverable Summary</label>
              <textarea
                rows={2}
                placeholder="Notes for reviewer or approver..."
                value={submitterNotes}
                onChange={(e) => setSubmitterNotes(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
              <button 
                type="button"
                onClick={onClose} 
                className="px-4 py-2 border border-slate-200 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all shadow-xs cursor-pointer flex items-center space-x-1.5"
              >
                <Icon name="uploadCloud" className="w-4 h-4" />
                <span>Upload & Send for Review</span>
              </button>
            </div>

          </form>
        </div>
      );
    }

    function ReviewProofModal({ task, onClose, onApprove, onReject }) {
      const [feedback, setFeedback] = useState('');

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-xl w-full p-6 space-y-4 text-xs animate-fade-in">
            
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="font-bold text-base text-slate-900">Inspect Work Deliverable</h3>
                <p className="text-slate-500 text-[11px] font-medium mt-0.5">Task: {task.title}</p>
              </div>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between">
              <div>
                <div className="font-bold text-slate-800">Submitted by: {task.submittedBy || 'Team Member'}</div>
                <div className="text-slate-500 text-[10px] mt-0.5">Date: {task.submittedAt || 'Recently'}</div>
              </div>
              <span className="text-[10px] font-extrabold px-2 py-1 rounded bg-amber-100 text-amber-800 border border-amber-200 uppercase">
                {task.status === 'completed' ? 'Approved' : 'In Review'}
              </span>
            </div>

            {task.submitterNotes && (
              <div>
                <span className="font-bold text-slate-700 block mb-1">Submitter Notes:</span>
                <p className="p-2.5 bg-slate-100/70 rounded-xl text-slate-800 font-medium">{task.submitterNotes}</p>
              </div>
            )}

            {task.evidenceUrl && (
              <div>
                <span className="font-bold text-slate-700 block mb-1">Deliverable Link:</span>
                <a 
                  href={task.evidenceUrl} 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  className="text-indigo-600 hover:text-indigo-800 font-bold underline flex items-center space-x-1 break-all"
                >
                  <span>{task.evidenceUrl}</span>
                  <Icon name="externalLink" className="w-3.5 h-3.5 shrink-0" />
                </a>
              </div>
            )}

            {task.evidenceFiles && task.evidenceFiles.length > 0 && (
              <div>
                <span className="font-bold text-slate-700 block mb-1.5">Attached Files ({task.evidenceFiles.length}):</span>
                <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-1">
                  {task.evidenceFiles.map((f, i) => (
                    <div key={i} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-900 relative group h-28 flex items-center justify-center">
                      {f.type?.startsWith('image/') || f.dataUrl?.startsWith('data:image') ? (
                        <img src={f.dataUrl} alt="Proof" className="w-full h-full object-cover" />
                      ) : (
                        <div className="text-center p-2 text-white text-[10px]">
                          <Icon name="fileText" className="w-6 h-6 mx-auto mb-1 text-slate-300" />
                          <div className="truncate">{f.name || 'Attached File'}</div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div>
              <label className="font-semibold text-slate-700 block mb-1">Review Feedback / Revision Notes</label>
              <textarea
                rows={2}
                placeholder="Optional feedback for team member..."
                value={feedback}
                onChange={(e) => setFeedback(e.target.value)}
                className="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            <div className="flex justify-between items-center pt-4 border-t border-slate-100">
              <button 
                onClick={() => onReject(feedback)} 
                className="px-4 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 font-bold rounded-xl transition-colors cursor-pointer"
              >
                Request Revisions
              </button>
              
              <button 
                onClick={onApprove} 
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all shadow-xs cursor-pointer flex items-center space-x-1.5"
              >
                <Icon name="checkCircle" className="w-4 h-4" />
                <span>Approve & Complete</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    function DeleteModal({ taskTitle, onConfirm, onCancel }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-md w-full text-center space-y-4 animate-fade-in">
            <div className="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto">
              <Icon name="trash" className="w-6 h-6" />
            </div>
            <div>
              <h3 className="font-bold text-base text-slate-900">Delete Task?</h3>
              <p className="text-xs text-slate-500 mt-1">Are you sure you want to delete "{taskTitle}"?</p>
            </div>
            <div className="flex justify-center space-x-2 pt-2">
              <button onClick={onCancel} className="px-4 py-2 border rounded-xl text-xs font-semibold hover:bg-slate-50 cursor-pointer">
                Cancel
              </button>
              <button onClick={onConfirm} className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-xs cursor-pointer">
                Delete
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CloudBackupModal({ tasks, isLocalMode, onClose, onExport, onImport }) {
      const [importText, setImportText] = useState('');
      const [importMode, setImportMode] = useState('overwrite'); // 'overwrite' | 'merge'

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          onImport(event.target.result, importMode);
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-5 text-xs animate-fade-in">
            
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center space-x-2">
                <div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
                  <Icon name="database" className="w-5 h-5" />
                </div>
                <div>
                  <h3 className="font-bold text-base text-slate-900">Google Drive & Cloud Backup</h3>
                  <p className="text-[11px] text-slate-500 font-medium">Save and restore workspace tasks across devices</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
              <div>
                <span className="text-[10px] font-bold uppercase text-slate-400 block">Current Persistence Mode</span>
                <span className="font-bold text-slate-800 text-xs">
                  {isLocalMode ? 'Browser LocalStorage (GitHub Pages Mode)' : 'Live Firebase Realtime Sync'}
                </span>
              </div>
              <span className="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold border border-emerald-200">
                {tasks.length} Saved Tasks
              </span>
            </div>

            <div className="p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl space-y-2">
              <h4 className="font-bold text-slate-800 flex items-center space-x-1.5">
                <Icon name="download" className="w-4 h-4 text-indigo-600" />
                <span>1. Export Backup for Google Drive</span>
              </h4>
              <p className="text-slate-600 leading-relaxed">
                Download a complete <code className="bg-indigo-100/70 px-1 py-0.5 rounded text-indigo-800 font-mono text-[10px]">.json</code> snapshot of all tasks, attached proofs, and team notes. Upload this file directly to your <strong>Google Drive</strong> folder to back up your work.
              </p>
              <button
                onClick={onExport}
                className="mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition-all shadow-xs cursor-pointer flex items-center space-x-2"
              >
                <Icon name="download" className="w-4 h-4" />
                <span>Download Google Drive Backup (.json)</span>
              </button>
            </div>

            <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
              <h4 className="font-bold text-slate-800 flex items-center space-x-1.5">
                <Icon name="uploadCloud" className="w-4 h-4 text-emerald-600" />
                <span>2. Restore / Import Backup from Google Drive</span>
              </h4>

              <div className="flex items-center space-x-4 text-slate-700 font-medium">
                <label className="flex items-center space-x-1.5 cursor-pointer">
                  <input
                    type="radio"
                    name="importMode"
                    value="overwrite"
                    checked={importMode === 'overwrite'}
                    onChange={() => setImportMode('overwrite')}
                    className="text-indigo-600"
                  />
                  <span>Replace current board</span>
                </label>
                <label className="flex items-center space-x-1.5 cursor-pointer">
                  <input
                    type="radio"
                    name="importMode"
                    value="merge"
                    checked={importMode === 'merge'}
                    onChange={() => setImportMode('merge')}
                    className="text-indigo-600"
                  />
                  <span>Merge with current board</span>
                </label>
              </div>

              <div>
                <label className="font-semibold text-slate-700 block mb-1">Select Backup File from Computer / Google Drive Download:</label>
                <input
                  type="file"
                  accept=".json,application/json"
                  onChange={handleFileUpload}
                  className="w-full text-xs text-slate-500 border border-slate-200 rounded-xl p-2 bg-white"
                />
              </div>

              <div className="pt-2 border-t border-slate-200">
                <label className="font-semibold text-slate-700 block mb-1">Or Paste JSON Data directly:</label>
                <textarea
                  rows={2}
                  placeholder="Paste JSON string here..."
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                  className="w-full px-3 py-1.5 border border-slate-200 bg-white rounded-xl focus:outline-none font-mono text-[10px]"
                />
                {importText.trim() && (
                  <button
                    onClick={() => onImport(importText, importMode)}
                    className="mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl cursor-pointer"
                  >
                    Load Pasted Backup
                  </button>
                )}
              </div>
            </div>

            <div className="flex justify-end pt-2">
              <button 
                onClick={onClose} 
                className="px-4 py-2 border border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer"
              >
                Close
              </button>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
